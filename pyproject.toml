[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flow-forge-cli"
version = "1.4.2"
description = "Lightweight, cross-platform CLI and automation library for technical workflow generation and structured data processing."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Flow Forge Maintainers" }
]
keywords = ["cli", "automation", "workflow", "yaml", "codegen", "nodejs"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "PyYAML>=6.0.1",
    "pydantic>=2.7.0",
    "rich>=13.7.0",
]

[project.scripts]
flowforge = "cli:main"
